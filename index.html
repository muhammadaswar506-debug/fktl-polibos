<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FKTL POLIBOS</title>
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FKTL POLIBOS">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./FKTL_POLIBOS.png">
  <link rel="apple-touch-icon" href="./FKTL_POLIBOS.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #0b1120;
      font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
    }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0b1120; z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 38px; height: 38px; border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #8B0000; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
      position: relative; z-index: 20; background: transparent;
    }
    #installBanner {
      display: none; position: fixed; bottom: 16px; left: 16px; right: 16px;
      background: linear-gradient(135deg, #003366, #0f172a);
      border: 1px solid rgba(255,255,255,0.2); color: #fff;
      padding: 12px 16px; border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55); z-index: 9999;
      align-items: center; justify-content: space-between; gap: 10px;
    }
    .install-btn {
      background: #8B0000; color: #fff; border: none; padding: 9px 15px;
      border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
      white-space: nowrap;
    }
    .close-banner {
      background: transparent; color: #94a3b8; border: none;
      font-size: 18px; cursor: pointer; padding: 0 4px;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-weight:800;font-size:18px;margin-bottom:6px;">FKTL POLIBOS</div>
    <div style="font-size:13px;color:#94a3b8;">Memuat Sistem Informasi...</div>
  </div>

  <div id="installBanner">
    <div style="font-size:13px;line-height:1.35;">
      <strong>📲 Install Aplikasi FKTL POLIBOS</strong><br>
      <span style="font-size:11.5px;color:#cbd5e1;">Pasang di layar utama HP / perangkat Anda</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button id="btnInstallPwa" class="install-btn">Install</button>
      <button id="btnTutupBanner" class="close-banner" title="Tutup">✕</button>
    </div>
  </div>

  <iframe id="appFrame" allow="clipboard-read; clipboard-write; geolocation; microphone; camera; fullscreen"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwyzc5WOyyNej3XbmaXsUZmEIDNBO_kh3H6Xdf_x8LOqcYSVUxC4pRjpkUdO778gshljg/exec";
    const BATAS_30_MENIT = 30 * 60 * 1000;
    const frame = document.getElementById("appFrame");
    const loader = document.getElementById("loader");

    function sembunyikanLoader() {
      if (loader) loader.style.display = "none";
    }

    frame.addEventListener("load", sembunyikanLoader);
    setTimeout(sembunyikanLoader, 4000);

    function buatUserRinganB64(userB64Penuh) {
      try {
        const obj = JSON.parse(decodeURIComponent(escape(atob(userB64Penuh))));
        return btoa(unescape(encodeURIComponent(JSON.stringify({
          userId: obj.userId || "",
          nama: obj.nama || "",
          email: obj.email || "",
          role: obj.role || "MEMBER"
        }))));
      } catch (e) { return ""; }
    }

    function muatAplikasi() {
      try {
        const savedSid = localStorage.getItem("pwa_fktl_sid");
        const savedUser = localStorage.getItem("pwa_fktl_user");
        const lastActive = parseInt(localStorage.getItem("pwa_fktl_time") || "0", 10);
        const sekarang = Date.now();

        if (savedSid && savedUser && (sekarang - lastActive < BATAS_30_MENIT)) {
          localStorage.setItem("pwa_fktl_time", String(sekarang));
          const uRingan = buatUserRinganB64(savedUser);
          frame.src = GAS_URL + "?view=dashboard&sid=" + encodeURIComponent(savedSid) + "&u=" + encodeURIComponent(uRingan);
        } else {
          localStorage.removeItem("pwa_fktl_sid");
          localStorage.removeItem("pwa_fktl_user");
          localStorage.removeItem("pwa_fktl_time");
          frame.src = GAS_URL + "?view=login";
        }
      } catch (err) {
        frame.src = GAS_URL + "?view=login";
      }
    }

    window.addEventListener("message", function(e) {
      if (!e.data || !e.data.fktlAction) return;
      try {
        if (e.data.fktlAction === "SAVE_SESSION") {
          localStorage.setItem("pwa_fktl_sid", e.data.sid);
          localStorage.setItem("pwa_fktl_user", e.data.userB64);
          localStorage.setItem("pwa_fktl_time", String(Date.now()));
          if (e.data.goDashboard) {
            const uRingan = buatUserRinganB64(e.data.userB64);
            frame.src = GAS_URL + "?view=dashboard&sid=" + encodeURIComponent(e.data.sid) + "&u=" + encodeURIComponent(uRingan);
          }
        } else if (e.data.fktlAction === "NAVIGATE" && e.data.url) {
          // Kunci agar selalu menggunakan GAS_URL aktif, hanya mengambil parameter ?view=...
          const qIdx = String(e.data.url).indexOf("?");
          frame.src = qIdx !== -1 ? (GAS_URL + String(e.data.url).substring(qIdx)) : GAS_URL;
        } else if (e.data.fktlAction === "PING_ACTIVE") {
          if (localStorage.getItem("pwa_fktl_sid")) {
            localStorage.setItem("pwa_fktl_time", String(Date.now()));
          }
        } else if (e.data.fktlAction === "LOGOUT") {
          localStorage.removeItem("pwa_fktl_sid");
          localStorage.removeItem("pwa_fktl_user");
          localStorage.removeItem("pwa_fktl_time");
          frame.src = GAS_URL + "?view=login";
        }
      } catch (err) {}
    });

    muatAplikasi();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function(err) {});
      });
    }

    let deferredPrompt = null;
    const banner = document.getElementById("installBanner");
    const btnInstall = document.getElementById("btnInstallPwa");
    const btnTutup = document.getElementById("btnTutupBanner");

    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = "flex";
    });

    btnInstall.addEventListener("click", async function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = "none";
    });

    btnTutup.addEventListener("click", function() {
      banner.style.display = "none";
    });

    window.addEventListener("appinstalled", function() {
      deferredPrompt = null;
      banner.style.display = "none";
    });
  </script>
</body>
</html>
