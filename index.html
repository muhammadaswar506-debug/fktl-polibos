<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FKTL POLIBOS</title>
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./FKTL_POLIBOS.png">
  <link rel="apple-touch-icon" href="./FKTL_POLIBOS.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0b1120;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-write; geolocation; microphone; camera"></iframe>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    const GAS_URL = "https://script.google.com/macros/s/AKfycbwigqJwTaH1YWY6o5-tmoQ8kLU783DgW597b3TSJUiYIRTRGrNc6M-kBkhmcSigPS8hrg/exec";
    const BATAS_30_MENIT = 30 * 60 * 1000;
    const frame = document.getElementById("appFrame");

    function buatUserRinganB64(userB64Penuh) {
      try {
        const obj = JSON.parse(decodeURIComponent(escape(atob(userB64Penuh))));
        // Hapus foto Base64 dari parameter URL agar URL pendek & tidak memicu layar putih
        const ringan = {
          userId: obj.userId || "",
          nama: obj.nama || "",
          email: obj.email || "",
          role: obj.role || "MEMBER"
        };
        return btoa(unescape(encodeURIComponent(JSON.stringify(ringan))));
      } catch (e) {
        return "";
      }
    }

    function muatAplikasi() {
      const savedSid = localStorage.getItem("pwa_fktl_sid");
      const savedUser = localStorage.getItem("pwa_fktl_user");
      const lastActive = parseInt(localStorage.getItem("pwa_fktl_time") || "0", 10);
      const sekarang = Date.now();

      if (savedSid && savedUser && (sekarang - lastActive < BATAS_30_MENIT)) {
        localStorage.setItem("pwa_fktl_time", String(sekarang));
        const uRingan = buatUserRinganB64(savedUser);
        frame.src = GAS_URL + "?view=dashboard&sid=" + encodeURIComponent(savedSid) + "&u=" + encodeURIComponent(uRingan);
      } else {
        localStorage.removeItem("pwa_fktl_sid");
        localStorage.removeItem("pwa_fktl_user");
        localStorage.removeItem("pwa_fktl_time");
        frame.src = GAS_URL + "?view=login";
      }
    }

    window.addEventListener("message", function(e) {
      if (!e.data || !e.data.fktlAction) return;

      if (e.data.fktlAction === "SAVE_SESSION") {
        localStorage.setItem("pwa_fktl_sid", e.data.sid);
        localStorage.setItem("pwa_fktl_user", e.data.userB64);
        localStorage.setItem("pwa_fktl_time", String(Date.now()));
        // Jika baru saja login dari halaman Login, langsung arahkan iframe ke Dashboard
        if (e.data.goDashboard) {
          const uRingan = buatUserRinganB64(e.data.userB64);
          frame.src = GAS_URL + "?view=dashboard&sid=" + encodeURIComponent(e.data.sid) + "&u=" + encodeURIComponent(uRingan);
        }
      } else if (e.data.fktlAction === "PING_ACTIVE") {
        if (localStorage.getItem("pwa_fktl_sid")) {
          localStorage.setItem("pwa_fktl_time", String(Date.now()));
        }
      } else if (e.data.fktlAction === "LOGOUT") {
        localStorage.removeItem("pwa_fktl_sid");
        localStorage.removeItem("pwa_fktl_user");
        localStorage.removeItem("pwa_fktl_time");
        frame.src = GAS_URL + "?view=login";
      }
    });

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        const lastActive = parseInt(localStorage.getItem("pwa_fktl_time") || "0", 10);
        if (lastActive > 0 && (Date.now() - lastActive >= BATAS_30_MENIT)) {
          localStorage.removeItem("pwa_fktl_sid");
          localStorage.removeItem("pwa_fktl_user");
          localStorage.removeItem("pwa_fktl_time");
          frame.src = GAS_URL + "?view=login";
        }
      }
    });

    muatAplikasi();
  </script>
</body>
</html>
