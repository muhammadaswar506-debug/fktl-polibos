<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FKTL POLIBOS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="FKTL_POLIBOS.png">
  <link rel="apple-touch-icon" href="FKTL_POLIBOS.png">
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0f172a; 
      font-family: system-ui, -apple-system, sans-serif;
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block; 
    }
    /* Gaya Tombol Instal Melayang */
    #installContainer {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 8px 10px 8px 16px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    #installBtn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    #installBtn:hover {
      background-color: #1d4ed8;
    }
    #closeInstallBtn {
      background: transparent;
      color: #94a3b8;
      border: none;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 50%;
    }
    #closeInstallBtn:hover {
      color: #ffffff;
    }
    .install-text {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbwyzc5WOyyNej3XbmaXsUZmEIDNBO_kh3H6Xdf_x8LOqcYSVUxC4pRjpkUdO778gshljg/exec" allow="geolocation; microphone; camera; clipboard-read; clipboard-write"></iframe>

  <!-- Banner & Tombol Instalasi di Layar Pengguna -->
  <div id="installContainer">
    <span class="install-text">Pasang FKTL POLIBOS</span>
    <button id="installBtn">📲 Instal</button>
    <button id="closeInstallBtn" aria-label="Tutup">✕</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    let deferredPrompt;
    const installContainer = document.getElementById('installContainer');
    const installBtn = document.getElementById('installBtn');
    const closeInstallBtn = document.getElementById('closeInstallBtn');

    // Munculkan tombol saat browser siap menginstal PWA
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installContainer.style.display = 'flex';
    });

    // Eksekusi instalasi saat tombol diklik
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installContainer.style.display = 'none';
      }
      deferredPrompt = null;
    });

    // Tombol silang (✕) jika pengguna ingin menutup tombol sementara
    closeInstallBtn.addEventListener('click', () => {
      installContainer.style.display = 'none';
    });

    // Sembunyikan otomatis setelah aplikasi terinstal
    window.addEventListener('appinstalled', () => {
      installContainer.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
