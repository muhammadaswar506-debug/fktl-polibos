<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FKTL POLIBOS</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-write; geolocation; microphone; camera"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwyzc5WOyyNej3XbmaXsUZmEIDNBO_kh3H6Xdf_x8LOqcYSVUxC4pRjpkUdO778gshljg/exec";
    const BATAS_IDLE_MS = 30 * 60 * 1000; // 30 Menit
    const frame = document.getElementById("appFrame");

    function muatAplikasi() {
      const sid = localStorage.getItem("fktl_pwa_sid");
      const userB64 = localStorage.getItem("fktl_pwa_user");
      const lastActive = parseInt(localStorage.getItem("fktl_pwa_active") || "0", 10);
      const sekarang = Date.now();

      if (sid && userB64 && (sekarang - lastActive <= BATAS_IDLE_MS)) {
        localStorage.setItem("fktl_pwa_active", String(sekarang));
        frame.src = GAS_URL + "?view=dashboard&sid=" + encodeURIComponent(sid) + "&u=" + encodeURIComponent(userB64);
      } else {
        localStorage.removeItem("fktl_pwa_sid");
        localStorage.removeItem("fktl_pwa_user");
        localStorage.removeItem("fktl_pwa_active");
        frame.src = GAS_URL + "?view=login";
      }
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || !data.fktlAction) return;

      if (data.fktlAction === "SAVE_SESSION") {
        localStorage.setItem("fktl_pwa_sid", data.sid || "");
        localStorage.setItem("fktl_pwa_user", data.userB64 || "");
        localStorage.setItem("fktl_pwa_active", String(Date.now()));
      } else if (data.fktlAction === "PING_ACTIVE") {
        localStorage.setItem("fktl_pwa_active", String(Date.now()));
      } else if (data.fktlAction === "LOGOUT") {
        localStorage.removeItem("fktl_pwa_sid");
        localStorage.removeItem("fktl_pwa_user");
        localStorage.removeItem("fktl_pwa_active");
        frame.src = GAS_URL + "?view=login";
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }

    muatAplikasi();
  </script>
</body>
</html>
