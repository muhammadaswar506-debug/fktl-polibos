<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FKTL POLIBOS</title>
  <meta name="description" content="Sistem Informasi Terpadu Organisasi Forum Komunikasi Teknik Listrik Politeknik Bosowa">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FKTL POLIBOS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #installBanner {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #8B0000 0%, #003366 100%);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    #installBanner button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- Tampilan Penuh Web App FKTL POLIBOS -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwigqJwTaH1YWY6o5-tmoQ8kLU783DgW597b3TSJUiYIRTRGrNc6M-kBkhmcSigPS8hrg/exec?view=login" 
    allow="clipboard-write; geolocation; microphone; camera">
  </iframe>

  <!-- Tombol Pop-up Instal Aplikasi Otomatis -->
  <div id="installBanner" onclick="instalAplikasi()">
    <span>📲 Instal Aplikasi FKTL POLIBOS</span>
    <button type="button" onclick="tutupBanner(event)" title="Tutup">✕</button>
  </div>

  <script>
    // Registrasi Service Worker PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js");
      });
    }

    // Tangkap event instalasi otomatis dari browser Chrome/Edge
    let deferredPrompt;
    const banner = document.getElementById("installBanner");

    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = "flex";
    });

    function instalAplikasi() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() {
        deferredPrompt = null;
        banner.style.display = "none";
      });
    }

    function tutupBanner(e) {
      e.stopPropagation();
      banner.style.display = "none";
    }
  </script>
</body>
</html>
