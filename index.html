<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FKTL POLIBOS</title>
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./FKTL_POLIBOS.png">
  <link rel="apple-touch-icon" href="./FKTL_POLIBOS.png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #8B0000;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    p { margin: 0 0 24px; font-size: 13.5px; color: #94a3b8; }
    .btn {
      background: linear-gradient(135deg, #8B0000 0%, #dc2626 100%);
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
      margin-bottom: 12px;
    }
    .btn-install {
      background: #0284c7;
      display: none;
    }
  </style>
</head>
<body>
  <img src="./FKTL_POLIBOS.png" alt="Logo FKTL POLIBOS">
  <h1>FKTL POLIBOS</h1>
  <p>Forum Komunikasi Teknik Listrik<br>Politeknik Bosowa</p>

  <a class="btn" href="https://script.google.com/macros/s/AKfycbwigqJwTaH1YWY6o5-tmoQ8kLU783DgW597b3TSJUiYIRTRGrNc6M-kBkhmcSigPS8hrg/exec?view=login">🚀 Masuk ke Sistem FKTL POLIBOS</a>
  <button id="installBtn" class="btn btn-install" onclick="instalAplikasi()">📲 Instal Aplikasi di Perangkat</button>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbwigqJwTaH1YWY6o5-tmoQ8kLU783DgW597b3TSJUiYIRTRGrNc6M-kBkhmcSigPS8hrg/exec?view=login";

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    // Jika dibuka dari ikon aplikasi yang sudah diinstal di HP/Laptop, langsung arahkan ke sistem utama
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      window.location.replace(APP_URL);
    }

    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    function instalAplikasi() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
    }
  </script>
</body>
</html>
