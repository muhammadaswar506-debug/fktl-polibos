<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FKTL POLIBOS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="FKTL_POLIBOS.png">
  <link rel="apple-touch-icon" href="FKTL_POLIBOS.png">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #installBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999999;
      background: linear-gradient(135deg, #990000, #1a237e);
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50px;
      padding: 10px 18px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    #updateBanner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      align-items: center;
      gap: 12px;
      width: 85%;
      max-width: 340px;
      justify-content: space-between;
    }
    #updateBtn {
      background-color: #0d6efd;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbwyzc5WOyyNej3XbmaXsUZmEIDNBO_kh3H6Xdf_x8LOqcYSVUxC4pRjpkUdO778gshljg/exec" allow="geolocation; microphone; camera; clipboard-read; clipboard-write"></iframe>

  <button id="installBtn">📲 Instal Aplikasi</button>

  <div id="updateBanner">
    <span>Versi baru aplikasi tersedia!</span>
    <button id="updateBtn">Perbarui</button>
  </div>

  <script>
    let newWorker;
    const updateBanner = document.getElementById('updateBanner');
    const updateBtn = document.getElementById('updateBtn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          if (reg.waiting) {
            newWorker = reg.waiting;
            updateBanner.style.display = 'flex';
          }

          reg.addEventListener('updatefound', () => {
            newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                updateBanner.style.display = 'flex';
              }
            });
          });
        });
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }

    updateBtn.addEventListener('click', () => {
      if (newWorker) {
        newWorker.postMessage({ type: 'SKIP_WAITING' });
      }
      updateBanner.style.display = 'none';
    });

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
